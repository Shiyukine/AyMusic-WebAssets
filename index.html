<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible"
            content="IE=edge">
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">
        <title>AyMusic</title>
        <link rel="stylesheet"
            href="/main.css">
        <script src="index.js"></script>
        <script src="/main.js"
            type="module"></script>
    </head>

    <body class="loading">
        <div id="main">
            <div id="loadPanel">
                <h1>AyMusic</h1>
                <svg height="200"
                    width="200"
                    class="rotate">
                    <circle cx="100"
                        cy="100"
                        r="80"
                        stroke="#428bca"
                        stroke-width="12"
                        fill="#0000"
                        stroke-linecap="round" />
                </svg>
                <p class="center">{loading.haveError}</p>
                <p id="version_name">{loading}</p>
                <p class="right">{loading.dev}</p>
            </div>
        </div>
    </body>

</html>
