<style type="text/css" id="cssImport">
    @import url("/ui/windows/library/library.css");
</style>
<div class="library">
    <div id="main">
        <div id="menu">
            <p class="selected">{lib.mylib}</p>
            <p class="minimized">{lib.addPlaylist}</p>
        </div>
        <div id="view">
            <div class="panel havePanelInfo selected">
                <div class="panelInfo">
                    <p>{lib.mylib}</p>
                    <svg id="addPl" viewBox="0 0 24 24">
                        <title>{lib.addPlaylist}</title>
                        <path fill="currentColor"
                            d="M2,16H10V14H2M18,14V10H16V14H12V16H16V20H18V16H22V14M14,6H2V8H14M14,10H2V12H14V10Z" />
                    </svg>
                    <svg id="likedState" viewBox="0 0 24 24">
                        <path
                            d="M10,16.5V7.5L16,12M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"
                            fill="currentColor"></path>
                    </svg>
                </div>
                <div class="sub">
                    <div id="mylib_topbar" class="set last topbar">
                        <p class="selected">{pl.liked}</p>
                        <p>{playlists}</p>
                        <p>{albums}</p>
                        <p>{artists}</p>
                    </div>
                    <div id="mylib_list" class="set last">
                        <!--Show here some object (songs/pl etc) according to tab of topbar-->
                    </div>
                </div>
            </div>
            <div class="panel">
                <p id="pl_modifcreate">{lib.addPlaylist}</p>
                <div class="sub">
                    <div class="set">
                        <div id="pl_name" is="text-box" label="{plInfo.name}"></div>
                    </div>
                    <div class="set">
                        <div id="pl_desc" is="text-box" label="{plInfo.desc}"></div>
                    </div>
                    <div class="set">
                        <div id="pl_imgUrl" is="text-box" label="{plInfo.imgUrl}"></div>
                    </div>
                    <div class="set last">
                        <p>{plInfo.isPriv}</p>
                        <input type="range" min="0" max="1" value="1" class="slider" id="pl_isPriv">
                    </div>
                    <button id="pl_create">Create !</button>
                </div>
            </div>
            <div class="panel havePanelInfo">
                <div class="panelInfo">
                    <p id="playlist_name">{playlist.name}</p>
                    <svg id="plContextMenu" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M16,12A2,2 0 0,1 18,10A2,2 0 0,1 20,12A2,2 0 0,1 18,14A2,2 0 0,1 16,12M10,12A2,2 0 0,1 12,10A2,2 0 0,1 14,12A2,2 0 0,1 12,14A2,2 0 0,1 10,12M4,12A2,2 0 0,1 6,10A2,2 0 0,1 8,12A2,2 0 0,1 6,14A2,2 0 0,1 4,12Z" />
                    </svg>
                    <svg id="plState" viewBox="0 0 24 24">
                        <path
                            d="M10,16.5V7.5L16,12M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"
                            fill="currentColor"></path>
                    </svg>
                </div>
                <div class="sub">
                    <div class="set last" id="playlist_songs">
                        <!--Show here all songs from a playlist-->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
