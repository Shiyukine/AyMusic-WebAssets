<style type="text/css" id="cssImport">
    @import url("/ui/windows/library/library.css");
</style>
<div class="library">
    <p class="wintitle">{library}</p>
    <div id="main">
        <div id="menu">
            <p class="selected">{lib.mylib}</p>
            <p>{lib.addPlaylist}</p>
            <!--Faire la liste ici des autres playlists pour un meilleur accès-->
            <!--PENSER A ENLEVER CLASS="SELECTED" idem dans view-->
        </div>
        <div id="view">
            <div class="panel selected">
                <p>{lib.mylib}</p>
                <div class="sub">
                    <div id="mylib_topbar" class="set last topbar">
                        <p class="selected">{pl.liked}</p>
                        <p>{playlists}</p>
                        <p>{artists}</p>
                        <p>{albums}</p>
                        <!--Voici la liste ici de toutes les pl/songs/artists/albums suivis par l'user-->
                    </div>
                    <div id="mylib_list" class="set last">
                        <!--Show here some object (songs/pl etc) according to tab of topbar-->
                    </div>
                </div>
            </div>
            <div class="panel">
                <p>{lib.addPlaylist}</p>
                <div class="sub">
                    <div class="set last">

                    </div>
                </div>
            </div>
            <div class="panel">
                <p id="playlist_name">{playlist.name}</p>
                <div class="sub">
                    <div class="set last" id="playlist_songs">
                        <!--Show here all songs from a playlist-->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
