<style type="text/css" id="cssImport">
    @import url("/ui/windows/musicViewer/musicViewer.css");
    /*@import url("musicViewer.css");*/
</style>
<div id="musicBG">
    <div id="music">
        <div id="top">
            <img src="/resources/icon.ico" alt="" id="cover">
            <div id="titles">
                <h2 id="title">Title</h2>
                <p id="subtitle">Subtitle</p>
            </div>
            <div id="svgs">
                <svg id="changeState" viewBox="0 0 24 24">
                    <path
                        d="M10,16.5V7.5L16,12M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"
                        fill="currentColor"></path>
                </svg>
                <svg id="like" viewBox="0 0 24 24">
                    <path
                        d="M12.1 18.55L12 18.65L11.89 18.55C7.14 14.24 4 11.39 4 8.5C4 6.5 5.5 5 7.5 5C9.04 5 10.54 6 11.07 7.36H12.93C13.46 6 14.96 5 16.5 5C18.5 5 20 6.5 20 8.5C20 11.39 16.86 14.24 12.1 18.55M16.5 3C14.76 3 13.09 3.81 12 5.08C10.91 3.81 9.24 3 7.5 3C4.42 3 2 5.41 2 8.5C2 12.27 5.4 15.36 10.55 20.03L12 21.35L13.45 20.03C18.6 15.36 22 12.27 22 8.5C22 5.41 19.58 3 16.5 3Z"
                        fill="currentColor"></path>
                </svg>
                <svg id="edit_btn" viewBox="0 0 24 24">
                    <path
                        d="M5,3C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V12H19V19H5V5H12V3H5M17.78,4C17.61,4 17.43,4.07 17.3,4.2L16.08,5.41L18.58,7.91L19.8,6.7C20.06,6.44 20.06,6 19.8,5.75L18.25,4.2C18.12,4.07 17.95,4 17.78,4M15.37,6.12L8,13.5V16H10.5L17.87,8.62L15.37,6.12Z"
                        fill="currentColor"></path>
                </svg>
            </div>
        </div>
        <div class="list" id="edit">
            <h2 id="editTitle" class="sublistTitle">{mv.modifySong}</h2>
            <div id="editor" class="sublist editor">
                <p id="editHelp">{mv.modifySongHelp}</p>
                <br>
                <div id="edit_title" is="text-box" label="{mv.title}"></div>
                <div id="edit_artist" is="text-box" label="{mv.artist}"></div>
                <div id="edit_inline1" class="inline">
                    <p>{mv.explicit}</p>
                    <input type="range" min="0" max="1" value="1" class="slider" id="edit_explicit">
                </div>
                <div id="edit_inline2" class="inline">
                    <p>{mv.cropStart}</p>
                    <button id="edit_resetT1">{mv.resetPos}</button>
                    <button id="edit_curT1">{mv.usePos}</button>
                    <p id="edit_cropS" style="float: right;">0:00:00</p>
                </div>
                <div id="edit_inline3" class="inline">
                    <p>{mv.cropEnd}</p>
                    <button id="edit_resetT2">{mv.resetPos}</button>
                    <button id="edit_curT2">{mv.usePos}</button>
                    <p id="edit_cropE" style="float: right;">0:00:00</p>
                </div>
                <br>
                <br>
                <button id="edit_save">{mv.save}</button>
                <button id="edit_cancel">{mv.cancel}</button>
            </div>
        </div>
        <div class="list" id="list">
            <!--<h2 class="sublistTitle">Title</h2>
            <div class="sublist">

            </div>
            <h2 class="sublistTitle">Title</h2>
            <div class="sublist">

            </div>-->
        </div>
    </div>
</div>
