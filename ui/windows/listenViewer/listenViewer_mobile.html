<style type="text/css" id="cssImport">
    @import url("/ui/windows/listenViewer/listenViewer_mobile.css");
</style>
<div class="listen" id="listen">
    <div id="topbar">
        <svg id="back" fill="currentColor" viewBox="0 0 24 24">
            <path d="M15.41,16.58L10.83,12L15.41,7.41L14,6L8,12L14,18L15.41,16.58Z" />
        </svg>
        <p>{listenViewer.title}</p>
    </div>
    <div class="left">
        <img id="music_img" src="/resources/icon.ico">
        <div class="left_container">
            <div class="divMask">
                <p id="music_title">{unknown.title}</p>
            </div>
            <div class="divMask">
                <p id="music_artist">{unknown.artist}</p>
            </div>
        </div>
    </div>
    <div class="middle" id="middle" style="--max: 100">
        <div>
            <svg id="shuffle" viewBox="0 0 24 24" class="mini">
                <path
                    d="M17,3L22.25,7.5L17,12L22.25,16.5L17,21V18H14.26L11.44,15.18L13.56,13.06L15.5,15H17V12L17,9H15.5L6.5,18H2V15H5.26L14.26,6H17V3M2,6H6.5L9.32,8.82L7.2,10.94L5.26,9H2V6Z"
                    fill="currentColor"></path>
            </svg>
            <svg id="previous" class="miniButNot" viewBox="0 0 24 24">
                <path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z" fill="currentColor"></path>
            </svg>
            <svg id="changeState" viewBox="0 0 24 24">
                <path d="M10,16.5V7.5L16,12M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"
                    fill="currentColor"></path>
            </svg>
            <svg id="next" class="miniButNot" viewBox="0 0 24 24">
                <path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z" fill="currentColor"></path>
            </svg>
            <svg id="repeat" viewBox="0 0 24 24" class="mini">
                <path
                    d="M7,7h10v1.79c0,0.45 0.54,0.67 0.85,0.35l2.79,-2.79c0.2,-0.2 0.2,-0.51 0,-0.71l-2.79,-2.79c-0.31,-0.31 -0.85,-0.09 -0.85,0.36L17,5L6,5c-0.55,0 -1,0.45 -1,1v4c0,0.55 0.45,1 1,1s1,-0.45 1,-1L7,7zM17,17L7,17v-1.79c0,-0.45 -0.54,-0.67 -0.85,-0.35l-2.79,2.79c-0.2,0.2 -0.2,0.51 0,0.71l2.79,2.79c0.31,0.31 0.85,0.09 0.85,-0.36L7,19h11c0.55,0 1,-0.45 1,-1v-4c0,-0.55 -0.45,-1 -1,-1s-1,0.45 -1,1v3z"
                    fill="currentColor"></path>
            </svg>
        </div>
        <div style="display: flex; justify-content: center; margin-top: -2.3px;">
            <p id="curTime" style="text-align: end;">0:00:00</p>
            <div id="pb" is="progress-bar" value="0" max="100"></div>
            <p id="maxTime" style="text-align: start;">0:00:00</p>
        </div>
    </div>
    <div class="right">
        <svg id="like" viewBox="0 0 24 24">
            <path
                d="M12.1 18.55L12 18.65L11.89 18.55C7.14 14.24 4 11.39 4 8.5C4 6.5 5.5 5 7.5 5C9.04 5 10.54 6 11.07 7.36H12.93C13.46 6 14.96 5 16.5 5C18.5 5 20 6.5 20 8.5C20 11.39 16.86 14.24 12.1 18.55M16.5 3C14.76 3 13.09 3.81 12 5.08C10.91 3.81 9.24 3 7.5 3C4.42 3 2 5.41 2 8.5C2 12.27 5.4 15.36 10.55 20.03L12 21.35L13.45 20.03C18.6 15.36 22 12.27 22 8.5C22 5.41 19.58 3 16.5 3Z"

            <path
                d="M15,6H3V8H15V6M15,10H3V12H15V10M3,16H11V14H3V16M17,6V14.18C16.69,14.07 16.35,14 16,14A3,3 0 0,0 13,17A3,3 0 0,0 16,20A3,3 0 0,0 19,17V8H22V6H17Z"
                fill="currentColor"></path>
        </svg>
    </div>

</div>
