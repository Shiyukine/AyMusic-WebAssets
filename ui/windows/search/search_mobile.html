<style type="text/css" id="cssImport">
    @import url("/ui/windows/search/search_mobile.css");
</style>
<div class="search">
    <p class="wintitle">{search}</p>
    <div id="main">
        <div id="view">
            <div class="panel selected">
                <div class="sub">
                    <div id="top" class="set last">
                        <div id="picker">
                            <img src="/resources/iconround.ico" id="serv_ico">
                            <select name="serv" id="serv_picker">
                                <option value="iconround">All servers</option>
                            </select>
                        </div>
                        <input type="text" name="search" id="tb_search" tabindex="0">
                        <button id="clearSearch">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path
                                    d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"
                                    fill="currentColor" />
                            </svg>
                        </button>
                        <svg id="changeState" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" stroke="white" stroke-width="3" fill="#0000" stroke-linecap="round"> </circle>
                            </svg>
                        <button id="launchSearch"></button>
                    </div>
                    <div id="bottom" class="set last">
                        <h3>{songs}</h3>
                        <div id="songs" class="lists"></div>
                        <h3>{albums}</h3>
                        <div id="albums" class="lists"></div>
                        <h3>{artists}</h3>
                        <div id="artists" class="lists"></div>
                        <!--<h3>{playlists}</h3>
                        <div id="playlists" class="lists"></div>-->
                    </div>
                    <ul id="suggest" style="display: none;">
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
